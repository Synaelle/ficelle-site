name: image

# Checks the site, then publishes its image on ghcr.io, tagged latest and with
# the commit. The server pulls latest every day at 4:00
# (deploy/ficelle-site-update.timer).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # built and loaded here first: it reaches ghcr.io only once it starts and serves the page
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            ghcr.io/synaelle/ficelle-site:latest
            ghcr.io/synaelle/ficelle-site:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts and serves the page
        run: |
          set -eu
          docker run -d --name check --read-only --tmpfs /tmp -p 127.0.0.1:8090:8080 ghcr.io/synaelle/ficelle-site:${{ github.sha }}
          for _ in $(seq 20); do
            if curl -fsS http://127.0.0.1:8090/ | grep -q '<title>Ficelle</title>' \
              && curl -fsS -o /dev/null http://127.0.0.1:8090/site/favicon.svg \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/admin)" = 404 ]; then
              docker rm -f check
              exit 0
            fi
            sleep 2
          done
          docker logs check
          exit 1
      - name: the image serves the web version at /web/ and logs nothing of it
        run: |
          set -eu
          mkdir -p web/v1/assets
          echo '<title>web</title>' > web/v1/index.html
          echo 'ok' > web/v1/assets/main.js
          ln -s v1 web/current
          docker run -d --name web --read-only --tmpfs /tmp -p 127.0.0.1:8091:8080 \
            -v "$PWD/web:/usr/share/nginx/web:ro" ghcr.io/synaelle/ficelle-site:${{ github.sha }}
          sleep 3
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:8091/web | grep -q '^301 http://127.0.0.1:8091/web/$'
          curl -fsS -D headers http://127.0.0.1:8091/web/ | grep -q '<title>web</title>'
          grep -qi "content-security-policy:.*wasm-unsafe-eval" headers
          curl -fsS -D assets http://127.0.0.1:8091/web/assets/main.js | grep -q ok
          grep -qi "cache-control: public, max-age=31536000, immutable" assets
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/web/missing.js)" = 404 ]
          curl -fsS -o /dev/null http://127.0.0.1:8091/
          docker logs web > logs 2>&1
          docker rm -f web
          grep -q 'GET / ' logs
          ! grep -q '/web' logs
      - name: publish
        run: |
          docker push ghcr.io/synaelle/ficelle-site:${{ github.sha }}
          docker push ghcr.io/synaelle/ficelle-site:latest
