# The website on the server, next to the sync server. The front nginx sends
# / and /site/ to 127.0.0.1:8090.
services:
  site:
    image: ghcr.io/synaelle/ficelle-site:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:8080
    read_only: true
    tmpfs:
      - /tmp
    # the downloads mirror.sh keeps, served at /site/mirror/
    volumes:
      - ./mirror:/usr/share/nginx/html/site/mirror:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
