# Inside the container. The front nginx on the server handles HTTPS.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # the page, read again on each visit so a new version shows at once
    location = / {
        try_files /index.html =404;
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # built files carry a hash in their name, they never change
    location /site/assets/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the icons keep their names, so browsers ask each time
    location /site/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
