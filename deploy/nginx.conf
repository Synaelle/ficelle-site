# Inside the container. The front nginx on the server handles HTTPS.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # the page, read again on each visit so a new version shows at once
    location = / {
        try_files /index.html =404;
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # built files carry a hash in their name, they never change
    location /site/assets/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the list of mirrored downloads changes with each release, the files
    # under a version never do
    location = /site/mirror/mirror.json {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location /site/mirror/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the brand page, a folder of its own
    location = /site/brand {
        absolute_redirect off;
        return 301 /site/brand/;
    }

    # the icons keep their names, so browsers ask each time
    location /site/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # The web version, files only: nothing about a visitor is stored or
    # logged, not even an error, which could hold an address. Its notes stay
    # apart from a server's web version on the same address, each keeps its
    # own after the path it is served from.
    location = /web {
        access_log off;
        absolute_redirect off;
        return 301 /web/;
    }
    location /web/assets/ {
        alias /usr/share/nginx/web/current/assets/;
        access_log off;
        error_log /dev/null crit;
        include /etc/nginx/web-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /web/ {
        alias /usr/share/nginx/web/current/;
        index index.html;
        access_log off;
        error_log /dev/null crit;
        include /etc/nginx/web-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
