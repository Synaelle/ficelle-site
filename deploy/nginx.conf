# Inside the container. The front nginx on the server handles HTTPS.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # the page, read again on each visit so a new version shows at once
    location = / {
        try_files /index.html =404;
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # built files carry a hash in their name, they never change
    location /site/assets/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the list of mirrored downloads changes with each release, the files
    # under a version never do
    location = /site/mirror/mirror.json {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location /site/mirror/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the icons keep their names, so browsers ask each time
    location /site/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}

# The web version on its own address, so its notes never share a browser's
# storage with the site or the sync server. Files only: nothing about a
# visitor is stored or logged, not even an error, which could hold an address.
server {
    listen 8080;
    server_name ficelle-web.synaelle.com;
    root /usr/share/nginx/web/current;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    location = / {
        try_files /index.html =404;
        include /etc/nginx/web-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/web-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri =404;
        include /etc/nginx/web-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
